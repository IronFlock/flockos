# FlockOS boot script: A/B slot selection for RAUC's grub backend, after
# RAUC's contrib/grub.conf. Slot A is partition 2 and slot B partition 3 of
# the disk this file was loaded from; the kernel and initrd live inside the
# slot, so an update replaces them too.
#
# grubenv (next to this file, on the FLOCKOS partition) holds the state RAUC
# writes: ORDER, <slot>_OK, <slot>_TRY. The slot GRUB picks gets <slot>_TRY=1;
# only `rauc status mark-good` (the device-agent once it is online) clears it.
# A slot that boots but is never marked good is skipped on the next boot.
# FLOCKOS_CMDLINE in grubenv appends kernel parameters on both slots (for
# diagnosis and the QEMU tests); it is empty on a flashed device.

insmod part_gpt
insmod fat
insmod ext2
insmod loadenv
insmod regexp
insmod probe
insmod test
insmod echo
insmod linux
insmod gzio
insmod all_video

@GRUB_SERIAL@
terminal_input console serial
terminal_output console serial
set timeout=2

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set FLOCKOS_CMDLINE=""
load_env --file ${prefix}/grubenv

regexp --set=1:bootdisk '^([^,]+),' "${root}"

set slot=""
for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" ]; then
        OK=${A_OK}
        TRY=${A_TRY}
        A_TRY=1
    fi
    if [ "${SLOT}" = "B" ]; then
        OK=${B_OK}
        TRY=${B_TRY}
        B_TRY=1
    fi
    if [ "${OK}" = "1" -a "${TRY}" = "0" ]; then
        slot=${SLOT}
        break
    fi
done

# Every slot was tried and none was marked good: start over with the first
# good slot rather than not booting at all (there is no rescue system).
if [ -z "${slot}" ]; then
    if [ "${A_OK}" = "1" ]; then A_TRY=0; fi
    if [ "${B_OK}" = "1" ]; then B_TRY=0; fi
    for SLOT in ${ORDER}; do
        if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then slot=A; A_TRY=1; break; fi
        if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then slot=B; B_TRY=1; break; fi
    done
fi
if [ -z "${slot}" ]; then slot=A; fi

save_env --file ${prefix}/grubenv A_TRY A_OK B_TRY B_OK ORDER

if [ "${slot}" = "B" ]; then
    set part=gpt3
    set other=A
    set otherpart=gpt2
else
    set part=gpt2
    set other=B
    set otherpart=gpt3
fi
probe --set=partuuid --part-uuid "${bootdisk},${part}"
probe --set=otheruuid --part-uuid "${bootdisk},${otherpart}"

set CMDLINE="rw rootwait panic=10 systemd.gpt_auto=0 @CONSOLE_CMDLINE@ ${FLOCKOS_CMDLINE}"

# The second entry is GRUB's fallback when the chosen slot's kernel cannot be
# loaded at all; it is never chosen by the menu.
set default=0
set fallback=1

menuentry "FlockOS slot ${slot}" {
    linux (${bootdisk},${part})/vmlinuz root=PARTUUID=${partuuid} rauc.slot=${slot} ${CMDLINE}
    initrd (${bootdisk},${part})/initrd.img
}

menuentry "FlockOS slot ${other} (fallback)" {
    linux (${bootdisk},${otherpart})/vmlinuz root=PARTUUID=${otheruuid} rauc.slot=${other} ${CMDLINE}
    initrd (${bootdisk},${otherpart})/initrd.img
}
