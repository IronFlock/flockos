# IronFlockOS boot script: A/B slot selection for RAUC's grub backend, after
# RAUC's contrib/grub.conf. Slot A is partition 2 and slot B partition 3 of
# the disk this file was loaded from; the kernel and initrd live inside the
# slot, so an update replaces them too.
#
# grubenv (next to this file, on the IRONFLOCKOS partition) holds the state RAUC
# writes: ORDER, <slot>_OK, <slot>_TRY. The slot GRUB picks gets <slot>_TRY=1;
# only `rauc status mark-good` clears it: the device-agent once it is online,
# or ironflockos-slot-keep on a slot that has proven itself (docs/build.md).
# A slot that boots but is never marked good is skipped on the next boot.
# IRONFLOCKOS_CMDLINE in grubenv appends kernel parameters on both slots (for
# diagnosis and the QEMU tests); it is empty on a flashed device.
# IRONFLOCKOS_RT_CMDLINE holds the real-time tuning of an -rt image (written by
# ironflockos-rt-tuning from /data/ironflockos/rt.conf, the platform's setting).
#
# The screen (docs/build.md, "The screen"): the splash by default, with the
# menu hidden (Esc during the timeout shows it) and the kernel quiet.
# IRONFLOCKOS_BOOT=text (written by ironflockos-display from the device's
# display.conf; the installer stick's grubenv has it) boots as before the
# splash: the menu, the boot messages, no Plymouth. ironflockos.boot=text in
# IRONFLOCKOS_CMDLINE does the same whatever display.conf says (the QEMU
# tests, diagnosis). splash.cpio next to grubenv, written by ironflockos-splash,
# carries the device's own picture and goes into the initramfs after the
# slot's own; a damaged one stops nothing, the kernel skips what it cannot
# unpack and Plymouth shows IronFlock's logo.
#
# GRUB is Debian's signed build (ADR-0011), started by shim. It reads this
# file next to itself ($fw_path/grub.cfg) before its built-in prefix
# /EFI/debian, where /EFI/debian/grub.cfg sources this file too. ${prefix}
# stays /EFI/debian either way, so the script sets it to its own directory,
# where grubenv is. GRUB's modules are built in, and under Secure Boot it
# loads no others, so every insmod below names a built-in one; shim checks
# the kernel GRUB loads.

insmod part_gpt
insmod fat
insmod ext2
insmod loadenv
insmod regexp
insmod probe
insmod test
insmod echo
insmod linux
insmod gzio
insmod all_video
insmod efifwsetup

@GRUB_SERIAL@
terminal_input console @GRUB_TERMINAL@
terminal_output console @GRUB_TERMINAL@
set timeout=2

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set IRONFLOCKOS_CMDLINE=""
set IRONFLOCKOS_RT_CMDLINE=""
set IRONFLOCKOS_BOOT=splash
# /EFI/BOOT on the partition GRUB was started from ($root).
set prefix=($root)/EFI/BOOT
load_env --file ${prefix}/grubenv

# The splash's kernel parameters: quiet also on the serial console (the
# kernel has one log level; errors still go there, and the journal keeps
# everything); Plymouth draws although a serial console is named, draws into
# the kernel's framebuffer device, which keeps the picture after it quits,
# and the console's cursor stays hidden. boot=text turns Plymouth off.
set splash=yes
if [ "${IRONFLOCKOS_BOOT}" = text ]; then set splash=no; fi
if regexp ' ironflockos\.boot=text ' " ${IRONFLOCKOS_CMDLINE} "; then set splash=no; fi
set splash_initrd=""
if [ "${splash}" = yes ]; then
    set SPLASH_CMDLINE="quiet splash plymouth.ignore-serial-consoles plymouth.force-frame-buffer-on-boot vt.global_cursor_default=0"
    set timeout_style=hidden
    if [ -f ${prefix}/splash.cpio ]; then set splash_initrd=${prefix}/splash.cpio; fi
else
    set SPLASH_CMDLINE="plymouth.enable=0"
fi

regexp --set=1:bootdisk '^([^,]+),' "${root}"

set slot=""
for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" ]; then
        OK=${A_OK}
        TRY=${A_TRY}
        A_TRY=1
    fi
    if [ "${SLOT}" = "B" ]; then
        OK=${B_OK}
        TRY=${B_TRY}
        B_TRY=1
    fi
    if [ "${OK}" = "1" -a "${TRY}" = "0" ]; then
        slot=${SLOT}
        break
    fi
done

# Every slot was tried and none was marked good: start over with the first
# good slot rather than not booting at all (there is no rescue system).
if [ -z "${slot}" ]; then
    if [ "${A_OK}" = "1" ]; then A_TRY=0; fi
    if [ "${B_OK}" = "1" ]; then B_TRY=0; fi
    for SLOT in ${ORDER}; do
        if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then slot=A; A_TRY=1; break; fi
        if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then slot=B; B_TRY=1; break; fi
    done
fi
if [ -z "${slot}" ]; then slot=A; fi

save_env --file ${prefix}/grubenv A_TRY A_OK B_TRY B_OK ORDER

if [ "${slot}" = "B" ]; then
    set part=gpt3
    set other=A
    set otherpart=gpt2
    set otherok=${A_OK}
else
    set part=gpt2
    set other=B
    set otherpart=gpt3
    set otherok=${B_OK}
fi
probe --set=partuuid --part-uuid "${bootdisk},${part}"

set BASE_CMDLINE="rw rootwait panic=10 fsck.repair=yes systemd.gpt_auto=0 @CONSOLE_CMDLINE@"
set CMDLINE="${BASE_CMDLINE} ${SPLASH_CMDLINE} ${IRONFLOCKOS_RT_CMDLINE} ${IRONFLOCKOS_CMDLINE}"
# "Start with messages" in the menu: this boot on text, the setting as it is.
set TEXT_CMDLINE="${BASE_CMDLINE} plymouth.enable=0 ${IRONFLOCKOS_RT_CMDLINE} ${IRONFLOCKOS_CMDLINE}"

set default=0

menuentry "IronFlockOS slot ${slot}" {
    linux (${bootdisk},${part})/vmlinuz root=PARTUUID=${partuuid} rauc.slot=${slot} ${CMDLINE}
    initrd (${bootdisk},${part})/initrd.img ${splash_initrd}
}

# GRUB's fallback when the chosen slot's kernel cannot be loaded at all: the
# other slot, once it has been marked good (before the first update slot B
# does not even exist).
if [ "${otherok}" = "1" ]; then
    probe --set=otheruuid --part-uuid "${bootdisk},${otherpart}"
    set fallback=1
    menuentry "IronFlockOS slot ${other} (fallback)" {
        linux (${bootdisk},${otherpart})/vmlinuz root=PARTUUID=${otheruuid} rauc.slot=${other} ${CMDLINE}
        initrd (${bootdisk},${otherpart})/initrd.img ${splash_initrd}
    }
fi

# The entries a person at the device picks in the menu (Esc during the
# timeout), after the ones above so that default and fallback keep their
# numbers: the chosen slot once with its messages, and the firmware's setup,
# which the -rt kernel cannot reach from the running system (it turns the EFI
# runtime services off).
menuentry "Start with messages" {
    linux (${bootdisk},${part})/vmlinuz root=PARTUUID=${partuuid} rauc.slot=${slot} ${TEXT_CMDLINE}
    initrd (${bootdisk},${part})/initrd.img
}
if fwsetup --is-supported; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi
