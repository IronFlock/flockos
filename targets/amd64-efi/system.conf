# RAUC system configuration of IronFlockOS on UEFI targets (ADR-0006, master plan
# section 3.5). @COMPATIBLE@ is filled in by the build.
[system]
compatible=@COMPATIBLE@
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
# Slot status and RAUC's own state survive an A/B switch on /data.
data-directory=/data/rauc
bundle-formats=verity
max-bundle-download-size=4294967296

[keyring]
path=/etc/rauc/keyring.pem
# Pis have no RTC; every target checks certificates at the bundle's signing
# time, not at the device's clock.
use-bundle-signing-time=true
check-purpose=codesign

[handlers]
# Carries the device's identity (machine-id, hostname) into the slot just
# written.
post-install=/usr/lib/ironflockos/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B
