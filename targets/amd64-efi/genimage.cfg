# Disk image of amd64-efi (master plan, section 3.2). The image holds the
# FLOCKOS partition (ESP) and slot A only; systemd-repart creates slot B and
# the data partition on the first boot, so the image stays small.
# @…@ placeholders are filled in by build/mkimage.sh.
image @IMAGE_NAME@ {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "@DISK_UUID@"
	}

	partition @ESP_PART_NAME@ {
		partition-type-uuid = "U"
		partition-uuid = "@ESP_UUID@"
		image = "esp.vfat"
		offset = 1M
	}

	partition @ROOT_PART_NAME@ {
		partition-type-uuid = "@ROOT_PART_TYPE@"
		partition-uuid = "@ROOT_A_UUID@"
		image = "rootfs.ext4"
		size = @SLOT_SIZE@
	}
}
