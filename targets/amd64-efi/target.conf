# amd64-efi: UEFI x86 edge PCs and IPCs (master plan, sections 3.2 and 3.7).
# Plain KEY=value data, read by build/lib.sh load_conf.

ARCH=amd64
BOOTLOADER=grub-efi
GRUB_FORMAT=x86_64-efi
EFI_LOADER=BOOTX64.EFI
# Kernel console on the first serial port as well as the screen; the screen
# stays /dev/console (last console= wins).
CONSOLE_CMDLINE="console=ttyS0,115200n8 console=tty0"
GRUB_SERIAL="serial --unit=0 --speed=115200"
ESP_SIZE=256M
# Fixed RAUC slot size per variant (rootfs-a in the image, rootfs-b created
# on first boot by systemd-repart).
SLOT_SIZE_BASE=4G
SLOT_SIZE_NVIDIA=8G
# GPT type of the root slots: "root-x86-64" of the Discoverable Partitions
# Specification, which systemd-repart calls Type=root on this architecture.
ROOT_PART_TYPE=4f68bce3-e8cd-4db1-96e7-fbcaf984b709
QEMU_SYSTEM=qemu-system-x86_64
