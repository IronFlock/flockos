# arm64-efi: generic arm64 machines with UEFI: edge servers and boxes with
# SystemReady firmware, arm64 VMs (master plan, Phase 7; WP-7.1). The
# Raspberry Pi and Jetson have their own targets.
# Plain KEY=value data, read by build/lib.sh load_conf.
#
# Boot script, RAUC system.conf, disk layout and repart.d are amd64-efi's
# (symlinks): the A/B scheme of the EFI targets is one.

ARCH=arm64
BOOTLOADER=grub-efi
GRUB_FORMAT=arm64-efi
EFI_LOADER=BOOTAA64.EFI
# Kernel console on the PL011 UART of QEMU's virt machine and most SystemReady
# boards, as well as the screen (last console= wins).
CONSOLE_CMDLINE="console=ttyAMA0,115200n8 console=tty0"
# GRUB on arm64 reaches the serial port through the firmware's Serial I/O
# protocol, not an I/O port.
GRUB_SERIAL="serial efi0"
ESP_SIZE=256M
# Fixed RAUC slot size (rootfs-a in the image, rootfs-b created on first boot
# by systemd-repart). No nvidia variant on arm64-efi.
SLOT_SIZE_BASE=4G
# GPT type of the root slots: "root-arm64" of the Discoverable Partitions
# Specification, which systemd-repart calls Type=root on this architecture.
ROOT_PART_TYPE=b921b045-1df0-41c3-af44-4c6f280d3fae
QEMU_SYSTEM=qemu-system-aarch64
