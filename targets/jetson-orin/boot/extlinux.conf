# IronFlockOS boot entry of a Jetson Orin root slot (WP-6.2). NVIDIA's
# L4TLauncher reads /boot/extlinux/extlinux.conf from the root slot it boots
# and fills in ${cbootargs}. root= and rauc.slot= name this slot: the build
# writes slot A's (APP), rauc-post-install the slot it has just written
# (/usr/lib/ironflockos/tegra-extlinux). The rest is NVIDIA's command line of
# the Orin modules (p3701, p3767).
TIMEOUT 30
DEFAULT ironflockos

MENU TITLE IronFlockOS

LABEL ironflockos
	MENU LABEL IronFlockOS
	LINUX /boot/Image
	INITRD /boot/initrd
	APPEND ${cbootargs} root=PARTUUID=@ROOT_PARTUUID@ rw rootwait rootfstype=ext4 panic=10 @CONSOLE_CMDLINE@ @TEGRA_CMDLINE@ rauc.slot=@SLOT@
