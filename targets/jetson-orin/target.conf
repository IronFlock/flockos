# jetson-orin: NVIDIA Jetson AGX Orin, Orin NX and Orin Nano on Jetson Linux
# r39.2.1 (JetPack 7.2.1) with an Ubuntu 24.04 userspace (ADR-0008; Phase 6).
# Plain KEY=value data, read by build/lib.sh load_conf. The BSP tarball
# (flash tools, partition layouts) is pinned in bsp.conf.
#
# WP-6.2 builds the root tree (FLOCKOS_STAGES=rootfs). The partition layout
# with APP/APP_b, the flash package and the SD image follow (WP-6.2, WP-6.4),
# the RAUC backend over nvbootctrl in WP-6.3.

ARCH=arm64
DISTRO=ubuntu-noble
# NVIDIA's UEFI firmware in QSPI starts L4TLauncher, which reads
# /boot/extlinux/extlinux.conf of the root slot it boots.
BOOTLOADER=tegra
SLOT_SIZE_BASE=8G
# The combined UART of the debug header, then the display.
CONSOLE_CMDLINE="console=ttyTCU0,115200 console=tty0"

# NVIDIA's apt repositories of r39.2 (common: CUDA, the container toolkit;
# som: the nvidia-l4t-* packages). Their key is apt/jetson-ota-public.asc,
# "NVIDIA Corporation <linux-tegra-bugs@nvidia.com>", fingerprint
# 3C6D1FF3100C8C3ABB0869C0E6543461A9996195 (checked by the unit tests), as
# nvidia-l4t-apt-source 39.2.1 ships it; it signs both repositories'
# InRelease.
L4T_MIRROR=https://repo.download.nvidia.com/jetson
L4T_SUITE=r39.2
L4T_SIGNER_FINGERPRINT=3C6D1FF3100C8C3ABB0869C0E6543461A9996195
# The L4T packages of Jetson Linux r39.2.1 (bsp.conf L4T_VERSION), the
# kernel's own version, and NVIDIA's container toolkit of JetPack 7.2.1.
L4T_PACKAGE_VERSION=39.2.1-20260806224157
L4T_KERNEL_VERSION=6.8.12-tegra-39.2.1-20260806224157
L4T_CONTAINER_TOOLKIT_VERSION=1.19.1-1
