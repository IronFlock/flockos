# RAUC system configuration of FlockOS on Jetson Orin (ADR-0006, ADR-0008;
# master plan section 3.5). @COMPATIBLE@ is filled in by the build.
#
# NVIDIA's rootfs A/B: the root slots are the APP and APP_b partitions of
# the layout flashed with ROOTFS_AB=1; the slot to boot is set through
# nvbootctrl -t rootfs by the custom backend (WP-6.3, which adds
# /usr/lib/flockos/tegra-rootfs-ab).
[system]
compatible=@COMPATIBLE@
bootloader=custom
data-directory=/data/rauc
bundle-formats=verity
max-bundle-download-size=8589934592

[keyring]
path=/etc/rauc/keyring.pem
use-bundle-signing-time=true
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/lib/flockos/tegra-rootfs-ab
# Carries the device's identity (machine-id, hostname) into the slot just
# written.
post-install=/usr/lib/flockos/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B
