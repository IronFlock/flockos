# NVIDIA Jetson Linux BSP of the jetson-orin target (ADR-0008; WP-6.1).
# Plain KEY=value data, read by build/fetch-bsp.sh.
#
# Jetson Linux r39.2.1 (JetPack 7.2.1, 2026-08-11), Ubuntu 24.04, kernel
# 6.8.12. The tarball carries the flash tools, the partition layouts, the
# bootloader binaries and capsule generation; the root filesystem's L4T
# packages come from NVIDIA's apt repositories at the same version.
L4T_VERSION=39.2.1
BSP_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/Jetson_Linux_R39.2.1_aarch64.tbz2
# NVIDIA publishes SHA-1 only (release_sha_hashes.txt next to the tarball);
# the SHA-256 is this repository's pin, taken on 2026-11-05 from a download
# whose SHA-1 matched NVIDIA's list.
BSP_HASHES_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/release_sha_hashes.txt
BSP_SHA1=8fe9a3ac9a98550b6077df450441599141ba47fb
BSP_SHA256=2e5619088ba88e85dab25247f033d70659b6f676ff835176a07766dcb0fdbe6b
