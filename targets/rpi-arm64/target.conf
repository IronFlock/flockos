# rpi-arm64: Raspberry Pi 4, 400, 5, CM4 and CM5, 64-bit (master plan,
# sections 3.2 and 3.7; WP-5.1). No GRUB: the Pi firmware reads autoboot.txt
# on the first partition and boots from the FAT boot partition it names.
# Plain KEY=value data, read by build/lib.sh load_conf.

ARCH=arm64
BOOTLOADER=rpi
# GPT, which the Pi 4 and Pi 5 bootloaders read (Pi 4 EEPROM from 2020-10).
# 1 FLOCKOS (autoboot.txt, the incoming .flock), 2 boot-a, 3 boot-b,
# 4 rootfs-a in the image; systemd-repart adds 5 rootfs-b and 6 data on the
# first boot.
FLOCKOS_SIZE=64M
BOOT_SIZE=256M
SLOT_SIZE_BASE=4G
# FAT partitions are "Microsoft basic data"; the root slots "root-arm64" of
# the Discoverable Partitions Specification.
FAT_PART_TYPE=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
ROOT_PART_TYPE=b921b045-1df0-41c3-af44-4c6f280d3fae
# serial0 is the GPIO 14/15 UART (Pi 4) or the debug connector (Pi 5).
CONSOLE_CMDLINE="console=serial0,115200 console=tty1"

# The Raspberry Pi archive: kernels, firmware, EEPROM tools. Its key is
# apt/raspberrypi.asc, "Raspberry Pi Archive Signing Key", fingerprint
# CF8A1AF502A2AA2D763BAE7E82B129927FA3303E (checked by the unit tests), as
# raspberrypi-archive-keyring 2025.1+rpt1 ships it: with SHA-256 binding
# signatures, which Debian 13's apt requires (the copy on the archive's web
# site still has SHA-1 ones).
RPI_MIRROR=https://archive.raspberrypi.com/debian
RPI_SIGNER_FINGERPRINT=CF8A1AF502A2AA2D763BAE7E82B129927FA3303E
