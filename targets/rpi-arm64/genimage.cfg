# Disk image of rpi-arm64 (master plan, section 3.2). The image holds the
# FLOCKOS partition, both boot partitions and slot A; systemd-repart creates
# slot B and the data partition on the first boot. Partition numbers are
# fixed: autoboot.txt and the RAUC backend (WP-5.2) name boot partitions by
# number. @…@ placeholders are filled in by build/mkimage-rpi.sh.
image @IMAGE_NAME@ {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "@DISK_UUID@"
	}

	partition FLOCKOS {
		partition-type-uuid = "@FAT_PART_TYPE@"
		partition-uuid = "@FLOCKOS_UUID@"
		image = "flockos.vfat"
		offset = 1M
	}

	partition boot-a {
		partition-type-uuid = "@FAT_PART_TYPE@"
		partition-uuid = "@BOOT_A_UUID@"
		image = "boot-a.vfat"
	}

	# Empty until the first update writes slot B's boot files (WP-5.2).
	partition boot-b {
		partition-type-uuid = "@FAT_PART_TYPE@"
		partition-uuid = "@BOOT_B_UUID@"
		size = @BOOT_SIZE@
	}

	partition rootfs-a {
		partition-type-uuid = "@ROOT_PART_TYPE@"
		partition-uuid = "@ROOT_A_UUID@"
		image = "rootfs.ext4"
		size = @SLOT_SIZE@
	}
}
