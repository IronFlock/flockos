# RAUC system configuration of FlockOS on the Raspberry Pi (ADR-0006, master
# plan section 3.5). @COMPATIBLE@ is filled in by the build.
#
# WP-5.1: no A/B switching yet. The noop backend lets RAUC report the slots
# and mark the booted one good; WP-5.2 replaces it with the custom backend
# over autoboot.txt and tryboot, and adds the boot partitions as slots of the
# same group.
[system]
compatible=@COMPATIBLE@
bootloader=noop
data-directory=/data/rauc
bundle-formats=verity
max-bundle-download-size=4294967296

[keyring]
path=/etc/rauc/keyring.pem
# No real-time clock: certificates are checked at the bundle's signing time.
use-bundle-signing-time=true
check-purpose=codesign

[handlers]
post-install=/usr/lib/flockos/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B
