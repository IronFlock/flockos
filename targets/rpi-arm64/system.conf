# RAUC system configuration of FlockOS on the Raspberry Pi (ADR-0006, master
# plan sections 3.2 and 3.5; WP-5.2). @COMPATIBLE@ is filled in by the build.
#
# A/B over the firmware's tryboot: /usr/lib/flockos/rpi-tryboot edits
# autoboot.txt on the FLOCKOS partition and arms tryboot. Each slot is a
# group of its boot partition (firmware, kernels, config.txt, cmdline.txt)
# and its root filesystem, updated together, so a kernel always runs with
# its modules.
[system]
compatible=@COMPATIBLE@
bootloader=custom
data-directory=/data/rauc
bundle-formats=verity
max-bundle-download-size=4294967296

[keyring]
path=/etc/rauc/keyring.pem
# No real-time clock: certificates are checked at the bundle's signing time.
use-bundle-signing-time=true
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/lib/flockos/rpi-tryboot
# Carries the device's identity into the new root slot and points the new
# boot partition's cmdline.txt at it.
post-install=/usr/lib/flockos/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.boot.0]
device=/dev/disk/by-partlabel/boot-a
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B

[slot.boot.1]
device=/dev/disk/by-partlabel/boot-b
type=vfat
parent=rootfs.1
