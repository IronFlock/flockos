# Release signature of the RAUC bundles (docs/signing.md; WP-1.6), read by
# build/sign-bundles.sh. Plain KEY=value data.
#
# Google's PKCS#11 library for Cloud KMS (GoogleCloudPlatform/kms-integrations,
# release pkcs11-v1.9 of 2025-12-09, linux-amd64): the tarball's SHA-256. The
# library's own signature is checked against Google's release key in
# build/keys/google-kmsp11-release.pub (from the library's user guide).
KMSP11_VERSION=1.9
KMSP11_SHA256=5397f965073cd5d1e2c43e5148f102f31a7c835902f97eb41c7c9c0f1b876a40
# The bundle signer in Cloud KMS: its key ring is the PKCS#11 token, the key
# the object, addressed by label (libp11 limits ids to 100 characters, which
# a key version name exceeds).
KMS_KEY_RING=projects/record-1283/locations/europe-west1/keyRings/flockos-rauc
KMS_TOKEN=flockos-rauc
KMS_KEY=bundle-signer

# Publishing (docs/release.md; WP-2.6), read by build/publish.sh and
# release.yml. The trees in the download bucket: a release is staged, tested,
# then copied to the live tree; the download proxy serves the bucket under
# DL_BASE (staging/ and flockos/).
BUCKET=gs://ironflock-downloads
DL_BASE=https://instance-registry.ironflock.com/dl
# The catalog key (tools/release-setup.sh) and the oldest device-agent that
# may install a release's bundles (each release keeps the one it was
# published with): 1.6.3, the first that downloads the bundle from its own
# update base (device-agent #206), so a device behind an IronFlock appliance
# gets it from the appliance's OS mirror. An older agent there is told to
# update itself first instead of failing to reach the cloud. 1.6.1 was the
# first with the catalog client (#202, in 1.6.0) and this key (#204).
CATALOG_KMS_KEY=projects/record-1283/locations/europe-west1/keyRings/ironflock-release/cryptoKeys/flockos-catalog/cryptoKeyVersions/1
CATALOG_MIN_AGENT=1.6.3

# Compute Engine images of every release (ADR-0010), read by
# build/gce-image.sh and release.yml: the boot images of the
# virtual-device-manager's FlockOS VMs. The images it makes, as
# <target>-<variant> (VMs need no real-time kernel; arm64-efi has no nvidia
# variant), each into the image family flockos-<target>-<variant> of
# GCE_PROJECT, stored in GCE_STORAGE_LOCATION (the manager's VMs run in
# europe-west1). An image's disk is the smallest the FlockOS layout fits
# (both slots, the FLOCKOS partition and GCE_DATA_MIN of /data), so Compute
# Engine refuses a VM disk the first boot could not partition.
GCE_PROJECT=record-1283
GCE_STORAGE_LOCATION=eu
GCE_IMAGES="amd64-efi-base amd64-efi-nvidia arm64-efi-base"
GCE_DATA_MIN=1G
