# The FlockOS images, each built in the build container
# (build/run-in-builder.sh): every target, variant and kernel, and the
# amd64-efi installer stick carrying the base image. Called by ci.yml with
# signing dev (throwaway keys, images and bundles trust only each other) and
# by release.yml with signing release (the images trust the FlockOS root CA;
# each bundle is sealed with a key of its build and gets its release
# signature in release.yml's sign job). Each image is the artifact
# image-<target>-<variant>[-rt].
name: build

on:
  workflow_call:
    inputs:
      signing:
        description: dev or release (build/signing.sh)
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The base variant with both kernels on the EFI targets (master plan,
  # section 3.11); nvidia and the Pi with the standard kernel. amd64 on x86
  # runners, arm64 on arm64 runners: the build container runs natively.
  image:
    name: image (${{ matrix.target }}, ${{ matrix.variant }}${{ matrix.kernel == 'rt' && ', rt' || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-efi
            variant: base
            kernel: std
            runner: ubuntu-latest
          - target: amd64-efi
            variant: base
            kernel: rt
            runner: ubuntu-latest
          - target: amd64-efi
            variant: nvidia
            kernel: std
            runner: ubuntu-latest
          - target: arm64-efi
            variant: base
            kernel: std
            runner: ubuntu-24.04-arm
          - target: arm64-efi
            variant: base
            kernel: rt
            runner: ubuntu-24.04-arm
          - target: rpi-arm64
            variant: base
            kernel: std
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      KERNEL: ${{ matrix.kernel }}
      SUFFIX: ${{ matrix.kernel == 'rt' && '-rt' || '' }}
      FLOCKOS_SIGNING: ${{ inputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools.lock
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: install just (tools.lock)
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - name: scratch space on the runner's second disk
        run: |
          sudo mkdir -p /mnt/flockos-work
          df -h / /mnt
      - name: just build ${{ env.TARGET }} ${{ env.VARIANT }} ${{ env.KERNEL }} (${{ env.FLOCKOS_SIGNING }})
        env:
          FLOCKOS_WORK: /mnt/flockos-work
        run: just build "$TARGET" "$VARIANT" "$KERNEL"
      # The release's SBOM of the image (CycloneDX, from the tree the build
      # left in its scratch space), published with it.
      - name: SBOM of the image (release builds)
        if: inputs.signing == 'release'
        run: |
          "$HARNESS/scripts/install-tool.sh" trivy
          image=flockos-$TARGET-$VARIANT$SUFFIX
          version=$(tr -d '[:space:]' < VERSION)
          sudo env "PATH=$PATH" trivy rootfs --quiet --scanners vuln --format cyclonedx \
            --output "out/$image/$image-$version.cdx.json" "/mnt/flockos-work/$image/rootfs"
          sudo chown "$(id -u):$(id -g)" "out/$image/$image-$version.cdx.json"
      - name: upload the image and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ env.TARGET }}-${{ env.VARIANT }}${{ env.SUFFIX }}
          path: out/flockos-${{ env.TARGET }}-${{ env.VARIANT }}${{ env.SUFFIX }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # The installer stick of amd64-efi, carrying the base image built above.
  installer:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: amd64-efi
      VARIANT: base
      FLOCKOS_SIGNING: ${{ inputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools.lock
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: install just (tools.lock)
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.TARGET }}-${{ env.VARIANT }}
          path: out/flockos-${{ env.TARGET }}-${{ env.VARIANT }}
      - name: just build ${{ env.TARGET }} installer (${{ env.FLOCKOS_SIGNING }})
        env:
          FLOCKOS_WORK: /mnt/flockos-work
        run: |
          sudo mkdir -p /mnt/flockos-work
          just build "$TARGET" installer
      - name: upload the installer image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ env.TARGET }}-installer
          path: out/flockos-${{ env.TARGET }}-installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
