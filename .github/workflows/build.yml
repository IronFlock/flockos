# Every IronFlockOS image, each built in the build container
# (build/run-in-builder.sh, image.yml): every target, variant and kernel, and
# the installer sticks of amd64-efi and arm64-efi (installer.yml), each
# carrying every image of its target.
# Called by release.yml with signing release (the images trust the
# IronFlockOS root CA; each bundle is sealed with a key of its build and gets
# its release signature in release.yml's sign job). ci.yml builds the same
# images one job each, with signing dev, so that each image's test starts as
# soon as its image is built. Each image is the artifact
# <prefix>-<target>-<variant>[-rt]: image-* from ci.yml, release-image-* from
# release.yml, which a release pull request's ci runs in the same workflow
# run.
name: build

on:
  workflow_call:
    inputs:
      signing:
        description: dev or release (build/signing.sh)
        type: string
        required: true
      prefix:
        description: >-
          the artifacts' names, <prefix>-<target>-<variant>[-rt]: release.yml
          passes release-image, so its build and ci.yml's (image) can run in
          one workflow run (a release pull request's ci) without a name clash
        type: string
        default: image

permissions:
  contents: read

jobs:
  # The base variant with both kernels on the EFI targets (master plan,
  # section 3.11); nvidia and the Pi with the standard kernel. amd64 on x86
  # runners, arm64 on arm64 runners: the build container runs natively. The
  # same list as ci.yml's image jobs (test/unit/release-signing.bats).
  image:
    name: image (${{ matrix.target }}, ${{ matrix.variant }}${{ matrix.kernel == 'rt' && ', rt' || '' }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-efi
            variant: base
            kernel: std
            runner: ubuntu-latest
          - target: amd64-efi
            variant: base
            kernel: rt
            runner: ubuntu-latest
          - target: amd64-efi
            variant: nvidia
            kernel: std
            runner: ubuntu-latest
          - target: arm64-efi
            variant: base
            kernel: std
            runner: ubuntu-24.04-arm
          - target: arm64-efi
            variant: base
            kernel: rt
            runner: ubuntu-24.04-arm
          - target: rpi-arm64
            variant: base
            kernel: std
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/image.yml
    with:
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}
      kernel: ${{ matrix.kernel }}
      runner: ${{ matrix.runner }}
      signing: ${{ inputs.signing }}
      prefix: ${{ inputs.prefix }}

  # The installer sticks of the EFI targets, each carrying every variant of its
  # target built above (INSTALLER_PAYLOADS in target.conf); installer.conf on
  # the stick picks the one to install.
  installer:
    name: installer (${{ matrix.target }})
    needs: [image]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-efi
            runner: ubuntu-latest
          - target: arm64-efi
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/installer.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      signing: ${{ inputs.signing }}
      prefix: ${{ inputs.prefix }}
