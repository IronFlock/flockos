# Gate (just lint / test, IronFlock/workflows shell-gate.yml), the image
# builds, the QEMU test of each image, workflow lint, the release intent and,
# on release pull requests, release.yml as a dry run. `ci-ok` is the required
# check of the main-branch ruleset.
#
# Debian images built and booted on every pull request (master plan, 3.8):
# amd64-efi base and nvidia (without a GPU, WP-4.1) on x86 runners,
# arm64-efi base on arm64 runners (WP-7.1). NVIDIA's repositories of the
# nvidia variant are x86_64 only.
#
# Pull requests into main only: the ruleset lets nothing reach main without
# ci-ok. The release intent decides whether the merge releases.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # lint and unit tests through the shared shell gate (tools from the
  # harness tools.lock). Its build job is skipped: the image build below
  # hands its output to the image tests.
  gate:
    uses: IronFlock/workflows/.github/workflows/shell-gate.yml@v1
    with:
      skip: build

  # The Go tools (tools/rauc-pki, the RAUC PKI; tools/catalog, the release
  # catalog): the shell gate has no Go.
  pki-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/rauc-pki/go.mod
          cache: false
      - name: gofmt, vet, test
        run: |
          for m in tools/rauc-pki tools/catalog; do
            echo "== $m"
            unformatted=$(gofmt -l "$m")
            [ -z "$unformatted" ] || { echo "gofmt: $unformatted"; exit 1; }
            go -C "$m" vet ./...
            go -C "$m" test -race -count=1 ./...
          done

  # Every image with throwaway keys, one job each (image.yml; the images of
  # build.yml, test/unit/release-signing.bats), and the installer sticks of
  # the EFI targets (installer.yml), each after the images of its target.
  # Each test below needs only the job of its own image: a matrix that needs
  # a matrix would wait for every image and both sticks.
  image-amd64-efi-base:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: base, kernel: std, runner: ubuntu-latest, signing: dev}
  image-amd64-efi-base-rt:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: base, kernel: rt, runner: ubuntu-latest, signing: dev}
  image-amd64-efi-nvidia:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: nvidia, kernel: std, runner: ubuntu-latest, signing: dev}
  image-arm64-efi-base:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: arm64-efi, variant: base, kernel: std, runner: ubuntu-24.04-arm, signing: dev}
  image-arm64-efi-base-rt:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: arm64-efi, variant: base, kernel: rt, runner: ubuntu-24.04-arm, signing: dev}
  image-rpi-arm64-base:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with: {target: rpi-arm64, variant: base, kernel: std, runner: ubuntu-24.04-arm, signing: dev}
  installer-amd64-efi:
    needs: [image-amd64-efi-base, image-amd64-efi-base-rt, image-amd64-efi-nvidia]
    uses: ./.github/workflows/installer.yml
    permissions:
      contents: read
    with: {target: amd64-efi, runner: ubuntu-latest, signing: dev}
  installer-arm64-efi:
    needs: [image-arm64-efi-base, image-arm64-efi-base-rt]
    uses: ./.github/workflows/installer.yml
    permissions:
      contents: read
    with: {target: arm64-efi, runner: ubuntu-24.04-arm, signing: dev}

  # Each image under QEMU (qemu-test.yml, test/qemu/run.py), KVM on amd64,
  # emulated (TCG) on the arm64 runners, which have no KVM: first boot,
  # reboot, update into slot B with the bundle of the same build, factory
  # reset, fallback of an untested slot, crash. Secure Boot is on, with
  # Microsoft's keys as PCs ship (ADR-0011), except for the rt images, which
  # keep the path with Secure Boot off tested.
  test-amd64-efi-base:
    needs: [image-amd64-efi-base]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: base, kernel: std, runner: ubuntu-latest, qemu: qemu-system-x86 ovmf, secure-boot: true}
  test-amd64-efi-base-rt:
    needs: [image-amd64-efi-base-rt]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: base, kernel: rt, runner: ubuntu-latest, qemu: qemu-system-x86 ovmf, secure-boot: false}
  test-amd64-efi-nvidia:
    needs: [image-amd64-efi-nvidia]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: nvidia, kernel: std, runner: ubuntu-latest, qemu: qemu-system-x86 ovmf, secure-boot: true}
  test-arm64-efi-base:
    needs: [image-arm64-efi-base]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: arm64-efi, variant: base, kernel: std, runner: ubuntu-24.04-arm, qemu: qemu-system-arm qemu-efi-aarch64, secure-boot: true}
  test-arm64-efi-base-rt:
    needs: [image-arm64-efi-base-rt]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: arm64-efi, variant: base, kernel: rt, runner: ubuntu-24.04-arm, qemu: qemu-system-arm qemu-efi-aarch64, secure-boot: false}

  # The installer stick (WP-3.2) carries every image of its target; the test
  # installs the base image (installer.conf payload=) to a blank NVMe
  # unattended, and the NVMe then boots alone. Both with Secure Boot on and
  # Microsoft's keys (ADR-0011).
  install-test-amd64-efi:
    needs: [installer-amd64-efi]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: amd64-efi, variant: installer, runner: ubuntu-latest, qemu: qemu-system-x86 ovmf, secure-boot: true}
  install-test-arm64-efi:
    needs: [installer-arm64-efi]
    uses: ./.github/workflows/qemu-test.yml
    permissions:
      contents: read
    with: {target: arm64-efi, variant: installer, runner: ubuntu-24.04-arm, qemu: qemu-system-arm qemu-efi-aarch64, secure-boot: true}

  # The Raspberry Pi image without a Pi (no QEMU for its firmware boot):
  # layout, autoboot.txt, the boot files and cmdline.txt of boot-a, slot A's
  # tree, and the image's own binaries in a chroot on the arm64 runner. The
  # boot itself is the hardware checklist (docs/testing.md).
  rpi-check:
    needs: [image-rpi-arm64-base]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-rpi-arm64-base
          path: image
      - name: rpi-check
        run: sudo test/image/rpi-check.sh image/*.img.gz

  # jetson-orin (WP-6.2): Ubuntu 24.04 with NVIDIA's L4T packages, built on
  # the arm64 runner (slot A's filesystem image and the RAUC bundle; NVIDIA's
  # flash tools write the disk) and its tree checked there in a chroot. Not
  # in build.yml's matrix: no Jetson image is released before the licence
  # review (ADR-0008).
  #
  # Switched off to save CI time until the Jetson work continues (jetson-flash
  # is skipped with it). To switch it on: set the repository variable
  # JETSON_CI to true, and put both jobs back into ci-ok's `needs` and
  # REQUIRED.
  jetson-rootfs:
    if: vars.JETSON_CI == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools.lock
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: install just (tools.lock)
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - name: scratch space on the runner's second disk
        run: |
          sudo mkdir -p /mnt/ironflockos-work
          df -h / /mnt
      - name: just build jetson-orin base
        env:
          IRONFLOCKOS_WORK: /mnt/ironflockos-work
        run: just build jetson-orin base
      - name: jetson-rootfs-check
        run: sudo test/image/jetson-rootfs-check.sh /mnt/ironflockos-work/ironflockos-jetson-orin-base/rootfs
      - name: upload the slot image, bundle, package list and os-release
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-jetson-orin-base
          path: out/ironflockos-jetson-orin-base/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

  # The flash dry run of jetson-orin (WP-6.2): NVIDIA's
  # l4t_initrd_flash.sh --no-flash with IronFlockOS's partition layout and the
  # slot image just built, offline for an Orin Nano 8GB developer kit, on an
  # x86_64 runner (NVIDIA's flashing host). The BSP tarball is cached by its
  # pin (targets/jetson-orin/bsp.conf).
  jetson-flash:
    needs: [jetson-rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ironflockos-bsp-cache
          key: l4t-bsp-${{ hashFiles('targets/jetson-orin/bsp.conf') }}
      - name: fetch and unpack the BSP
        run: |
          sudo mkdir -p /mnt/l4t
          sudo build/fetch-bsp.sh "$HOME/ironflockos-bsp-cache" /mnt/l4t
          sudo chown -R "$(id -u):$(id -g)" "$HOME/ironflockos-bsp-cache"
          df -h / /mnt
      - name: NVIDIA's flashing prerequisites
        run: sudo /mnt/l4t/Linux_for_Tegra/tools/l4t_flash_prerequisites.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-jetson-orin-base
          path: image
      # NVIDIA's l4t_initrd_flash.sh looks for Jetsons on the USB buses even
      # with --no-flash and fails where there is no bus at all, as on the
      # runner: in a mount namespace of its own it sees one empty bus.
      - name: tegra-flash-package (offline, Orin Nano 8GB developer kit)
        run: |
          # shellcheck disable=SC2016 # "$@" belongs to the inner bash
          sudo unshare -m bash -c 'mount -t tmpfs ironflockos-no-usb /sys/bus/usb/devices && mkdir /sys/bus/usb/devices/usb1 && exec "$@"' bash \
            build/tegra-flash-package.sh /mnt/l4t/Linux_for_Tegra image/ironflockos-jetson-orin-base-*.rootfs.ext4.zst \
            jetson-orin-nano-devkit 3767 0003
      - name: what the package holds
        if: ${{ always() }}
        run: |
          sudo find /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images -maxdepth 2 -printf '%M %10s %p\n' | sort -k3 | head -80 || true
          sudo cat /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images/external/flash.cfg 2>/dev/null || true
          sudo cat /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images/external/flash.idx 2>/dev/null || true

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The version decides: a bump makes a release PR (`just release-patch`,
  # title `release ironflockos v<version>`), an unchanged version a no-release PR
  # (`just merge`) whose merge releases nothing.
  intent:
    uses: IronFlock/workflows/.github/workflows/release-intent.yml@v1
    with:
      version-file: VERSION

  # Release pull requests only: release.yml as a dry run, so a broken release
  # workflow never reaches main.
  release-build:
    needs: [intent]
    if: needs.intent.outputs.kind == 'release'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded (skipped or cancelled counts as failed; release-build may
  # be skipped, on a no-release pull request).
  ci-ok:
    if: ${{ always() }}
    needs:
      - gate
      - pki-tool
      - image-amd64-efi-base
      - image-amd64-efi-base-rt
      - image-amd64-efi-nvidia
      - image-arm64-efi-base
      - image-arm64-efi-base-rt
      - image-rpi-arm64-base
      - installer-amd64-efi
      - installer-arm64-efi
      - test-amd64-efi-base
      - test-amd64-efi-base-rt
      - test-amd64-efi-nvidia
      - test-arm64-efi-base
      - test-arm64-efi-base-rt
      - install-test-amd64-efi
      - install-test-arm64-efi
      - rpi-check
      - workflows
      - intent
      - release-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          KIND: ${{ needs.intent.outputs.kind }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'del(."release-build") | [.[].result] | all(. == "success")' <<<"$NEEDS" >/dev/null
          release_build=$(jq -r '."release-build".result' <<<"$NEEDS")
          echo "release-build: $release_build ($KIND)"
          if [ "$KIND" = release ]; then [ "$release_build" = success ]; else [ "$release_build" = skipped ]; fi
