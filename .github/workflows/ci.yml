# Gate (just lint / test, IronFlock/workflows shell-gate.yml), the image
# build, the QEMU image test, workflow lint, the release intent and, on
# release pull requests, release.yml as a dry run. `ci-ok` is the required
# check of the main-branch ruleset.
#
# Pull requests into main only: the ruleset lets nothing reach main without
# ci-ok. The release intent decides whether the merge releases.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Debian images built and booted on every pull request (master plan, 3.8):
  # amd64-efi base and nvidia (without a GPU, WP-4.1) on x86 runners,
  # arm64-efi base on arm64 runners (WP-7.1), as the jobs' matrix. NVIDIA's
  # repositories of the nvidia variant are x86_64 only.
  # docker save of this image is loaded and run inside the VM.
  HELLO_WORLD: hello-world@sha256:c567b231f65614688711a75f31518a064258a51d442117a3e771a3a8fdba78ef

jobs:
  # lint and unit tests through the shared shell gate (tools from the
  # harness tools.lock). Its build job is skipped: the image build below
  # hands its output to the image tests.
  gate:
    uses: IronFlock/workflows/.github/workflows/shell-gate.yml@v1
    with:
      skip: build

  # The Go tools (tools/rauc-pki, the RAUC PKI; tools/catalog, the release
  # catalog): the shell gate has no Go.
  pki-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/rauc-pki/go.mod
          cache: false
      - name: gofmt, vet, test
        run: |
          for m in tools/rauc-pki tools/catalog; do
            echo "== $m"
            unformatted=$(gofmt -l "$m")
            [ -z "$unformatted" ] || { echo "gofmt: $unformatted"; exit 1; }
            go -C "$m" vet ./...
            go -C "$m" test -race -count=1 ./...
          done

  # Every image, with throwaway keys (build.yml): the targets, variants and
  # kernels, and the amd64-efi installer stick.
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      signing: dev

  # Boots the image under KVM and runs test/qemu/run.py: first boot, reboot,
  # update into slot B with the bundle of the same build, fallback of an
  # untested slot.
  image-test:
    name: image-test (${{ matrix.target }}, ${{ matrix.variant }}${{ matrix.kernel == 'rt' && ', rt' || '' }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    # arm64 runners have no KVM: the arm64 image boots emulated (TCG).
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-efi
            variant: base
            kernel: std
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
          - target: amd64-efi
            variant: base
            kernel: rt
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
          - target: amd64-efi
            variant: nvidia
            kernel: std
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
          - target: arm64-efi
            variant: base
            kernel: std
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm qemu-efi-aarch64
          - target: arm64-efi
            variant: base
            kernel: rt
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm qemu-efi-aarch64
    env:
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      KERNEL: ${{ matrix.kernel }}
      SUFFIX: ${{ matrix.kernel == 'rt' && '-rt' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.TARGET }}-${{ env.VARIANT }}${{ env.SUFFIX }}
          path: out/flockos-${{ env.TARGET }}-${{ env.VARIANT }}${{ env.SUFFIX }}
      - name: install QEMU, UEFI firmware and mtools
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # a space-separated list of package names
          sudo apt-get install -y -qq --no-install-recommends $QEMU_PACKAGES qemu-utils mtools
      - name: give the runner KVM, where it has one
        run: |
          if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: the VM runs emulated"; exit 0; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: hello-world image for the VM
        run: |
          docker pull "$HELLO_WORLD"
          docker tag "$HELLO_WORLD" hello-world:latest
          docker save -o "$RUNNER_TEMP/hello-world.tar" hello-world:latest
      - name: QEMU image test
        run: |
          sudo mkdir -p /mnt/flockos-qemu
          sudo chown "$(id -u):$(id -g)" /mnt/flockos-qemu
          python3 -I test/qemu/run.py --target "$TARGET" --variant "$VARIANT" --kernel "$KERNEL" \
            --work /mnt/flockos-qemu --keep --docker-image-tar "$RUNNER_TEMP/hello-world.tar"
      - name: console and shell logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-logs-${{ env.TARGET }}-${{ env.VARIANT }}${{ env.SUFFIX }}
          path: |
            /mnt/flockos-qemu/console.log
            /mnt/flockos-qemu/shell.log
          if-no-files-found: ignore
          retention-days: 7

  # The installer stick (WP-3.2) carries every image of its target just built;
  # the test installs the base image (installer.conf payload=).
  # The stick installs to a blank NVMe unattended; the NVMe then boots alone.
  install-test:
    name: install-test (${{ matrix.target }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    # arm64 runners have no KVM: the arm64 installer runs emulated (TCG).
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-efi
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
          - target: arm64-efi
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm qemu-efi-aarch64
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.TARGET }}-installer
          path: out/flockos-${{ env.TARGET }}-installer
      - name: install QEMU, UEFI firmware and mtools
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # a space-separated list of package names
          sudo apt-get install -y -qq --no-install-recommends $QEMU_PACKAGES qemu-utils mtools
      - name: give the runner KVM, where it has one
        run: |
          if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: the VM runs emulated"; exit 0; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: QEMU install test
        run: |
          sudo mkdir -p /mnt/flockos-install
          sudo chown "$(id -u):$(id -g)" /mnt/flockos-install
          python3 -I test/qemu/run.py --target "$TARGET" --variant installer --work /mnt/flockos-install --keep
      - name: console and shell logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-logs-${{ env.TARGET }}-installer
          path: |
            /mnt/flockos-install/console-installer.log
            /mnt/flockos-install/console.log
            /mnt/flockos-install/shell.log
            /mnt/flockos-install/flockos-installer.log
          if-no-files-found: ignore
          retention-days: 7

  # The Raspberry Pi image without a Pi (no QEMU for its firmware boot):
  # layout, autoboot.txt, the boot files and cmdline.txt of boot-a, slot A's
  # tree, and the image's own binaries in a chroot on the arm64 runner. The
  # boot itself is the hardware checklist (docs/testing.md).
  rpi-check:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-rpi-arm64-base
          path: image
      - name: rpi-check
        run: sudo test/image/rpi-check.sh image/*.img.gz

  # jetson-orin (WP-6.2): Ubuntu 24.04 with NVIDIA's L4T packages, built on
  # the arm64 runner (slot A's filesystem image and the RAUC bundle; NVIDIA's
  # flash tools write the disk) and its tree checked there in a chroot. Not
  # in build.yml's matrix: no Jetson image is released before the licence
  # review (ADR-0008).
  jetson-rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools.lock
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: install just (tools.lock)
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - name: scratch space on the runner's second disk
        run: |
          sudo mkdir -p /mnt/flockos-work
          df -h / /mnt
      - name: just build jetson-orin base
        env:
          FLOCKOS_WORK: /mnt/flockos-work
        run: just build jetson-orin base
      - name: jetson-rootfs-check
        run: sudo test/image/jetson-rootfs-check.sh /mnt/flockos-work/flockos-jetson-orin-base/rootfs
      - name: upload the slot image, bundle, package list and os-release
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-jetson-orin-base
          path: out/flockos-jetson-orin-base/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

  # The flash dry run of jetson-orin (WP-6.2): NVIDIA's
  # l4t_initrd_flash.sh --no-flash with FlockOS's partition layout and the
  # slot image just built, offline for an Orin Nano 8GB developer kit, on an
  # x86_64 runner (NVIDIA's flashing host). The BSP tarball is cached by its
  # pin (targets/jetson-orin/bsp.conf).
  jetson-flash:
    needs: [jetson-rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flockos-bsp-cache
          key: l4t-bsp-${{ hashFiles('targets/jetson-orin/bsp.conf') }}
      - name: fetch and unpack the BSP
        run: |
          sudo mkdir -p /mnt/l4t
          sudo build/fetch-bsp.sh "$HOME/flockos-bsp-cache" /mnt/l4t
          sudo chown -R "$(id -u):$(id -g)" "$HOME/flockos-bsp-cache"
          df -h / /mnt
      - name: NVIDIA's flashing prerequisites
        run: sudo /mnt/l4t/Linux_for_Tegra/tools/l4t_flash_prerequisites.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-jetson-orin-base
          path: image
      # NVIDIA's l4t_initrd_flash.sh looks for Jetsons on the USB buses even
      # with --no-flash and fails where there is no bus at all, as on the
      # runner: in a mount namespace of its own it sees one empty bus.
      - name: tegra-flash-package (offline, Orin Nano 8GB developer kit)
        run: |
          # shellcheck disable=SC2016 # "$@" belongs to the inner bash
          sudo unshare -m bash -c 'mount -t tmpfs flockos-no-usb /sys/bus/usb/devices && mkdir /sys/bus/usb/devices/usb1 && exec "$@"' bash \
            build/tegra-flash-package.sh /mnt/l4t/Linux_for_Tegra image/flockos-jetson-orin-base-*.rootfs.ext4.zst \
            jetson-orin-nano-devkit 3767 0003
      - name: what the package holds
        if: ${{ always() }}
        run: |
          sudo find /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images -maxdepth 2 -printf '%M %10s %p\n' | sort -k3 | head -80 || true
          sudo cat /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images/external/flash.cfg 2>/dev/null || true
          sudo cat /mnt/l4t/Linux_for_Tegra/tools/kernel_flash/images/external/flash.idx 2>/dev/null || true

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The version decides: a bump makes a release PR (`just release-patch`,
  # title `release flockos v<version>`), an unchanged version a no-release PR
  # (`just merge`) whose merge releases nothing.
  intent:
    uses: IronFlock/workflows/.github/workflows/release-intent.yml@v1
    with:
      version-file: VERSION

  # Release pull requests only: release.yml as a dry run, so a broken release
  # workflow never reaches main.
  release-build:
    needs: [intent]
    if: needs.intent.outputs.kind == 'release'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded (skipped or cancelled counts as failed; release-build may
  # be skipped, on a no-release pull request).
  ci-ok:
    if: ${{ always() }}
    needs: [gate, pki-tool, build, image-test, rpi-check, install-test, jetson-rootfs, jetson-flash, workflows, intent, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          REQUIRED: ${{ needs.gate.result }} ${{ needs.pki-tool.result }} ${{ needs.build.result }} ${{ needs.image-test.result }} ${{ needs.rpi-check.result }} ${{ needs.install-test.result }} ${{ needs.jetson-rootfs.result }} ${{ needs.jetson-flash.result }} ${{ needs.workflows.result }} ${{ needs.intent.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          KIND: ${{ needs.intent.outputs.kind }}
        run: |
          echo "required: $REQUIRED, release-build: $RELEASE_BUILD ($KIND)"
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          if [ "$KIND" = release ]; then [ "$RELEASE_BUILD" = success ]; else [ "$RELEASE_BUILD" = skipped ]; fi
