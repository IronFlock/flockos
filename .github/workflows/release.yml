# Release of FlockOS: the merge of a release pull request (`just
# release-patch`: version bump, title `release flockos v<version>`) builds
# every image, signs the RAUC bundles in Cloud KMS, publishes images, bundles
# and the signed catalog, makes the Compute Engine images of the virtual
# devices, and sets the tag last (a tag means "devices can get it"). Nothing
# is built, signed or published from a laptop.
#
# `build` builds every image as a release build (build.yml), `sign` gives
# the bundles their release signature (WP-1.6). The stage, e2e and promote
# jobs (WP-2.6) slot in after `sign`, each `needs` the one before, and
# `sources` (the release's source code) between stage and promote; vm-images
# (ADR-0010) follows promote, and `tag` needs both.
#
# A no-release merge starts nothing: `paths` holds only VERSION, and when a
# no-release pull request touches it anyway the jobs are skipped by its merge
# title. ci.yml calls this workflow on release pull requests (workflow_call)
# as a dry run; a manual run (workflow_dispatch) is a dry run too.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_call:
  workflow_dispatch:
    inputs:
      promote-production:
        description: >-
          On a release tag only: move the production channel of the catalog to
          this release (the release must be in the catalog; nothing is built).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    # A no-release merge that touches the version file anyway: no runner.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # release: publish and tag; released: a re-run after the tag (nothing
      # left to do); dry-run: build, publish nothing.
      mode: ${{ steps.mode.outputs.mode }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: what this run releases
        id: mode
        env:
          VERSION_FILE: VERSION
          TAG_PREFIX: v
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: main
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          "$RUNNER_TEMP/harness/scripts/release.sh" mode

  # Every image as a release build (build.yml): the images trust the FlockOS
  # root CA, and each bundle is sealed with a throwaway key of its build. No
  # job of the build holds the release identity.
  build:
    needs: [verify]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      signing: release
      prefix: release-image

  # The release signature (docs/signing.md). Only a release run gets the
  # workload identity flockos-release: the pool grants it to a push of
  # release.yml on main (a release merge) and to runs on v* tags. This job
  # re-signs every bundle with the bundle signer in Cloud KMS through PKCS#11
  # and checks it against the FlockOS root CA (build/sign-bundles.sh). A dry
  # run does the same with a throwaway stand-in for the signer.
  sign:
    needs: [verify, build]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: dl
      - name: one directory per image, as the build left it
        run: |
          mkdir out
          for d in dl/release-image-*; do mv "$d" "out/flockos-${d#dl/release-image-}"; done
          ls -l out/*/
      - name: authenticate the bundle signer (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-release@record-1283.iam.gserviceaccount.com
      - name: sign the bundles (${{ env.MODE }})
        run: build/sign-in-builder.sh "$MODE" out
      - name: upload the signed images and bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.MODE }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The SLSA provenance of every image and bundle as signed (Build Level 3),
  # by the harness in a job that runs none of this repository's code: sign
  # holds a workload identity and runs this repository's scripts, so it can
  # never hold the identity a verifier pins (docs/signing.md). Before stage,
  # so nothing is published without it. A dry run only checks the files.
  attest:
    needs: [verify, sign]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    uses: IronFlock/workflows/.github/workflows/attest-provenance.yml@v1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      artifact: release-${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      subject-path: |
        */*.img.gz
        */*.raucb
      dry-run: ${{ needs.verify.outputs.mode != 'release' }}

  # The release images as published, in QEMU (test/qemu/run.py, amd64-efi
  # base under KVM, with Secure Boot on and Microsoft's keys as PCs ship,
  # ADR-0011): first boot, enrollment from the test .flock, reboot. A
  # release also updates into slot B with its own bundle, whose Cloud KMS
  # signature the image's keyring (the FlockOS root CA) must accept, and
  # falls back. A dry run's bundles carry the stand-in's signature, which no
  # release image accepts: it boots and reboots only.
  e2e:
    needs: [verify, sign]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      HELLO_WORLD: hello-world@sha256:c567b231f65614688711a75f31518a064258a51d442117a3e771a3a8fdba78ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.MODE }}
          path: out
      - name: install QEMU, OVMF and mtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf mtools
      - name: give the runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: hello-world image for the VM
        run: |
          docker pull "$HELLO_WORLD"
          docker tag "$HELLO_WORLD" hello-world:latest
          docker save -o "$RUNNER_TEMP/hello-world.tar" hello-world:latest
      - name: QEMU test of the release image (${{ env.MODE }})
        run: |
          sudo mkdir -p /mnt/flockos-qemu
          sudo chown "$(id -u):$(id -g)" /mnt/flockos-qemu
          only=()
          [ "$MODE" = release ] || only=(--only boot)
          python3 -I test/qemu/run.py --target amd64-efi --variant base "${only[@]}" --secure-boot \
            --work /mnt/flockos-qemu --keep --docker-image-tar "$RUNNER_TEMP/hello-world.tar"
      - name: console and shell logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ env.MODE }}
          path: |
            /mnt/flockos-qemu/console.log
            /mnt/flockos-qemu/shell.log
          if-no-files-found: ignore
          retention-days: 7

  # The signed release to the staging tree, as the publisher identity
  # (flockos-publisher: the FlockOS trees of the download bucket only).
  stage:
    needs: [verify, sign, attest]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      DRY_RUN: ${{ needs.verify.outputs.mode == 'release' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.MODE }}
          path: out
      - name: authenticate the publisher (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-publisher@record-1283.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.MODE == 'release'
      - name: stage (${{ env.MODE }})
        run: build/publish.sh stage out "$(tr -d '[:space:]' < VERSION)"
      # What the GitHub Release carries besides the catalog, kept apart from
      # the images: the assets job then downloads a few hundred kilobytes,
      # not every image and bundle (v0.10.0's assets job timed out on that).
      # Also the source packages of every image, for the sources job.
      - name: the release's checksums, SBOMs and source packages
        run: |
          mkdir meta
          build/publish.sh sums out > meta/SHA256SUMS
          cp out/*/*.cdx.json meta/
          cat out/*/*.sources.tsv | LC_ALL=C sort -u > meta/sources.tsv
          ls -l meta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta-${{ env.MODE }}
          path: meta/
          if-no-files-found: error
          retention-days: 7

  # The release's source code (docs/release.md, "Source code"): apt in the
  # build container finds every file of every source package of the images
  # (build/sources.sh plan; release/sources names those outside the
  # archives). The files the pool flockos/sources/ lacks go there, and the
  # index SOURCES goes to the staging tree, which promote publishes with the
  # images (build/publish.sh sources). As the publisher. A dry run looks up
  # every source package the same way, so one without source fails it, and
  # uploads nothing.
  sources:
    needs: [verify, stage]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      DRY_RUN: ${{ needs.verify.outputs.mode == 'release' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta-${{ env.MODE }}
          path: meta
      - name: where the source of every package is
        run: |
          build/sources.sh plan meta/sources.tsv > sources.plan
          echo "$(cut -f 1,2 sources.plan | sort -u | wc -l) source packages, $(awk -F'\t' '$3 != "-"' sources.plan | wc -l) files" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: authenticate the publisher (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-publisher@record-1283.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.MODE == 'release'
      - name: publish the sources (${{ env.MODE }})
        run: build/publish.sh sources sources.plan "$(tr -d '[:space:]' < VERSION)"

  # The live release: the staged files to flockos/<version>/, the release
  # notes (release-notes/*.md) to flockos/release-notes.json, then the
  # catalog (tools/catalog), built on the published one with this release on
  # the test channel (the first release is production too), signed with the
  # catalog key in Cloud KMS as flockos-release, and published last. Then
  # every file and the catalog must answer through the download proxy, or
  # there is no tag. A dry run signs with a throwaway key and publishes
  # nothing.
  promote:
    needs: [verify, stage, e2e, sources]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      DRY_RUN: ${{ needs.verify.outputs.mode == 'release' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.MODE }}
          path: out
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/catalog/go.mod
          cache: false
      - name: the published catalog (none before the first release)
        run: |
          # The bucket's public face, not the proxy: a 404 here means there is no catalog yet.
          code=$(curl -sS -o previous.json -w '%{http_code}' --retry 5 \
            https://storage.googleapis.com/ironflock-downloads/flockos/manifest.json)
          case "$code" in
            200) echo "PREVIOUS=previous.json" >> "$GITHUB_ENV" ;;
            404) rm -f previous.json; echo "no published catalog: this is the first release" ;;
            *) echo "::error::the published catalog answers $code"; exit 1 ;;
          esac
      - name: authenticate the catalog signer (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-release@record-1283.iam.gserviceaccount.com
      - name: build and sign the catalog (${{ env.MODE }})
        run: |
          . build/lib.sh
          load_conf build/release.conf
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$MODE" = release ]; then
            [ -f pki/flockos-catalog.pub ] || { echo "::error::pki/flockos-catalog.pub is missing: tools/release-setup.sh"; exit 1; }
            pub=$PWD/pki/flockos-catalog.pub
            signer=(-kms-key "$CATALOG_KMS_KEY")
          else
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/catalog-key.pem"
            openssl pkey -in "$RUNNER_TEMP/catalog-key.pem" -pubout -out "$RUNNER_TEMP/catalog-key.pub"
            pub=$RUNNER_TEMP/catalog-key.pub
            signer=(-key-file "$RUNNER_TEMP/catalog-key.pem")
          fi
          previous=()
          if [ -n "${PREVIOUS:-}" ] && [ -f pki/flockos-catalog.pub ]; then
            previous=(-previous "$PWD/$PREVIOUS" -pubkey "$PWD/pki/flockos-catalog.pub")
          fi
          cd tools/catalog
          go run . build -dir ../../out -repo ../.. -version "$version" -channel test \
            -url "$DL_BASE/flockos/$version" -min-agent "$CATALOG_MIN_AGENT" \
            -boards ../../release/boards.json "${previous[@]}" -o ../../payload.json
          go run . sign -payload ../../payload.json "${signer[@]}" -pubkey "$pub" -o ../../manifest.json
          go run . verify -pubkey "$pub" ../../manifest.json >/dev/null
          rm -f "$RUNNER_TEMP/catalog-key.pem"
          cd ../..
          jq '{issued_at, channels, releases: (.releases | keys)}' payload.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ env.MODE }}
          path: |
            manifest.json
            payload.json
          if-no-files-found: error
          retention-days: 30
      - name: authenticate the publisher (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-publisher@record-1283.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.MODE == 'release'
      - name: promote, publish the catalog, check (${{ env.MODE }})
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          build/publish.sh promote "$version"
          build/publish.sh notes release-notes
          build/publish.sh catalog manifest.json
          if [ "$MODE" = release ]; then
            build/publish.sh check "$version" manifest.json
          fi

  # The Compute Engine images of the release (ADR-0010): the boot images of
  # the virtual-device-manager's FlockOS VMs, amd64-efi base and nvidia and
  # arm64-efi base (GCE_IMAGES in build/release.conf; no real-time kernel for
  # VMs). Each is made from the published image, which it must match by
  # SHA256SUMS, into its image family flockos-<target>-<variant>, from which
  # the manager creates new VMs (build/gce-image.sh). After the promotion, so
  # a family never offers an unpublished release; the tag waits for them. As
  # the publisher, which may make flockos-* images in record-1283 and nothing
  # else of Compute Engine (tools/release-setup.sh). A dry run makes the
  # tarballs and prints the cloud calls.
  vm-images:
    name: vm image (${{ matrix.image }})
    needs: [verify, promote]
    if: needs.verify.outputs.mode == 'release' || needs.verify.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [amd64-efi-base, amd64-efi-nvidia, arm64-efi-base]
    env:
      MODE: ${{ needs.verify.outputs.mode == 'release' && 'release' || 'dry-run' }}
      DRY_RUN: ${{ needs.verify.outputs.mode == 'release' && '0' || '1' }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image as the build left it (signing re-signs only the bundles),
      # and the release's SHA256SUMS, which it must match.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-${{ matrix.image }}
          path: out/flockos-${{ matrix.image }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta-${{ env.MODE }}
          path: meta
      - name: authenticate the publisher (release only)
        if: env.MODE == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-publisher@record-1283.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.MODE == 'release'
      - name: the Compute Engine image of ${{ env.IMAGE }} (${{ env.MODE }})
        env:
          FLOCKOS_WORK: /mnt/flockos-gce
        run: |
          sudo mkdir -p "$FLOCKOS_WORK"
          sudo chown "$(id -u):$(id -g)" "$FLOCKOS_WORK"
          build/gce-image.sh "out/flockos-$IMAGE" "$(tr -d '[:space:]' < VERSION)" meta/SHA256SUMS

  # Production promotion (docs/release.md): run by hand on a release's tag
  # (gh workflow run release.yml --ref v<version> -f promote-production=true).
  # The release's files are published already; the catalog's production
  # channel moves to it, signed with the catalog key as flockos-release and
  # published as flockos-publisher, then checked through the download proxy.
  # The workload identity pool gives both identities to runs on v* tags.
  production:
    needs: [verify]
    if: needs.verify.outputs.mode == 'tag' && inputs.promote-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/catalog/go.mod
          cache: false
      - name: the published catalog
        run: |
          curl -fsS --retry 5 -o previous.json https://storage.googleapis.com/ironflock-downloads/flockos/manifest.json
      - name: authenticate the catalog signer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-release@record-1283.iam.gserviceaccount.com
      - name: move production to this release, sign
        run: |
          . build/lib.sh
          load_conf build/release.conf
          version=$(tr -d '[:space:]' < VERSION)
          pub=$PWD/pki/flockos-catalog.pub
          cd tools/catalog
          go run . build -version "$version" -channel production -boards ../../release/boards.json \
            -previous ../../previous.json -pubkey "$pub" -o ../../payload.json
          go run . sign -payload ../../payload.json -kms-key "$CATALOG_KMS_KEY" -pubkey "$pub" -o ../../manifest.json
          go run . verify -pubkey "$pub" ../../manifest.json >/dev/null
          cd ../..
          jq '{issued_at, channels, releases: (.releases | keys)}' payload.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: authenticate the publisher
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: flockos-publisher@record-1283.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: publish the catalog, check
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          build/publish.sh catalog manifest.json
          build/publish.sh check "$version" manifest.json

  tag:
    needs: [verify, promote, vm-images]
    if: needs.verify.outputs.mode == 'release'
    uses: IronFlock/workflows/.github/workflows/release-tag.yml@v1
    permissions:
      contents: read
    # The App key is a secret of the `release` environment; environment
    # secrets reach a reusable workflow only through `secrets: inherit`.
    secrets: inherit # zizmor: ignore[secrets-inherit] # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    with:
      version-file: VERSION
      github-release: true

  # The GitHub Release the tag job made gets the release's checksums, SBOMs
  # and catalog (the images and bundles are on the download server; links in
  # SHA256SUMS' names below DL_BASE/flockos/<version>/). As the release App,
  # like the tag: this workflow's token stays read-only.
  assets:
    needs: [verify, tag]
    if: needs.verify.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta-release
          path: meta
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-release
          path: catalog
      - name: release App token (contents of this repository)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: attach checksums, SBOMs and the catalog
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          gh release upload "v$version" --repo "$REPO" --clobber meta/SHA256SUMS catalog/manifest.json meta/*.cdx.json
