# Security screening from the shared IronFlock CI harness: secrets (gitleaks),
# semgrep, configuration, licences, and the Go module of tools/rauc-pki
# (govulncheck, SBOM). The scan of the built root filesystem runs in ci.yml
# (`rootfs-scan`), where the image is built; master plan, section 3.8.
#
# Report-only for the first two weeks, as the harness README asks; then set
#   fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
# Accepted findings go into .trivyignore.yaml / security/vex.openvex.json /
# .gitleaks.toml with a reason and an expiry date.
name: security

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:41 UTC: catch findings against unchanged code.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: IronFlock/workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      languages: go
      working-directory: tools/rauc-pki
      go-version-file: tools/rauc-pki/go.mod
      fail-on: ""
      # Public repository: findings also go to the Security tab.
      code-scanning: true
