# Security screening from the shared IronFlock CI harness: secrets (gitleaks),
# semgrep, configuration, licences, the Go module of tools/rauc-pki
# (govulncheck, SBOM), and the packages of every IronFlockOS image (the
# harness's rootfs-recipe input below; master plan, section 3.8; WP-1.8).
#
# Blocking since WP-0.6 (2026-11-06, after the report-only start the harness
# README asks for): security / report fails on the standard categories, as in
# device-init. Accepted findings go into .trivyignore.yaml /
# security/vex.openvex.json / .gitleaks.toml with a reason and an expiry date;
# an expired one blocks again.
name: security

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:41 UTC: catch findings against unchanged code, and against
    # the packages of unchanged images.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: IronFlock/workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      languages: go
      working-directory: tools/rauc-pki
      go-version-file: tools/rauc-pki/go.mod
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
      # Public repository: findings also go to the Security tab.
      code-scanning: true
      # The packages of every image (WP-1.8): `just rootfs` builds each
      # image's root tree in ROOTFS_WORK (no disk image), and the harness
      # scans it with trivy rootfs: SARIF of the vulnerabilities with a fix,
      # counted by `security / report` and shown in code scanning, and the
      # CycloneDX SBOM as the artifact security-rootfs-sbom-<name>. The images
      # of build.yml (test/unit/release-signing.bats checks it).
      rootfs-recipe: rootfs
      rootfs-matrix: >-
        [
          {"name": "amd64-efi-base", "args": "amd64-efi base std", "path": "ironflockos-amd64-efi-base/rootfs"},
          {"name": "amd64-efi-base-rt", "args": "amd64-efi base rt", "path": "ironflockos-amd64-efi-base-rt/rootfs"},
          {"name": "amd64-efi-nvidia", "args": "amd64-efi nvidia std", "path": "ironflockos-amd64-efi-nvidia/rootfs"},
          {"name": "arm64-efi-base", "args": "arm64-efi base std", "path": "ironflockos-arm64-efi-base/rootfs", "runner": "ubuntu-24.04-arm"},
          {"name": "arm64-efi-base-rt", "args": "arm64-efi base rt", "path": "ironflockos-arm64-efi-base-rt/rootfs", "runner": "ubuntu-24.04-arm"},
          {"name": "rpi-arm64-base", "args": "rpi-arm64 base std", "path": "ironflockos-rpi-arm64-base/rootfs", "runner": "ubuntu-24.04-arm"}
        ]
