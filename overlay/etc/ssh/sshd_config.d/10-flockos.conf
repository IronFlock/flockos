# FlockOS: key-only SSH (master plan, section 3.9). Host keys live on /data so
# a device keeps its SSH identity across A/B updates.
HostKey /data/etc/ssh/ssh_host_ed25519_key
HostKey /data/etc/ssh/ssh_host_ecdsa_key
HostKey /data/etc/ssh/ssh_host_rsa_key
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
