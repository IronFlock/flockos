# IronFlockOS's splash (docs/build.md, "The screen"). The build copies this
# file and the theme into the tree before it makes the initramfs, which
# carries both.
#
# DeviceTimeout=0: Plymouth takes every screen device at once, the kernel's
# framebuffer devices too (plymouth.force-frame-buffer-on-boot), and the
# firmware's framebuffer before the graphics driver is there. Without it
# Plymouth draws only through the graphics device for its first eight
# seconds, and the framebuffer device, which keeps the splash when Plymouth
# quits (/usr/lib/ironflockos/keep-splash), would be black on a fast boot.
[Daemon]
Theme=ironflockos
ShowDelay=0
DeviceTimeout=0
