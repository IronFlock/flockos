# IronFlockOS's splash (docs/build.md, "The screen"). The build copies this
# file and the theme into the tree before it makes the initramfs, which
# carries both.
#
# DeviceTimeout: Plymouth takes the graphics devices (DRM) at once and the
# kernel's framebuffer devices (plymouth.force-frame-buffer-on-boot) only
# when this timeout has passed. The framebuffer device keeps the splash when
# Plymouth quits (/usr/lib/ironflockos/keep-splash), so Plymouth has to draw
# into it from the start: after a tenth of a second, not Debian's eight
# seconds, which a fast boot ends before. Not 0: plymouthd asserts a timeout
# above 0 and aborts (ply_event_loop_watch_for_timeout).
[Daemon]
Theme=ironflockos
ShowDelay=0
DeviceTimeout=0.1
