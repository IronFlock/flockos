# IronFlockOS additions to the distribution's chrony.conf, which keeps its NTP
# pools and the NTP servers DHCP hands out (docs/build.md, "Time").

# The kernel keeps the real-time clock in UTC (rtcsync); chronyd -s
# (/etc/default/chrony) reads it at start.
rtconutc

# PTP, when /etc/flockos/ptp.conf names an interface: /usr/lib/flockos/ptp
# writes the source here before chronyd starts. An empty or missing directory
# adds nothing.
confdir /run/flockos/chrony

# NTP servers from /etc/flockos/proxy.conf (ntp=), for networks that block NTP
# to the internet: /usr/lib/flockos/proxy writes them here and has chronyd
# reload them (chronyc reload sources).
sourcedir /run/flockos/chrony-sources
