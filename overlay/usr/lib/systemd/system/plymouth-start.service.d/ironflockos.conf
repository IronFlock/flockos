# A splash that fails must leave the device as it would be without one
# (docs/build.md, "The screen"): a plymouthd that crashes does not make the
# system "degraded", which a device's health checks would read. The journal
# still says how it ended (Main process exited, code=killed), and the QEMU
# test fails on that line. The boot does not wait on Plymouth either way.
[Service]
SuccessExitStatus=SIGABRT SIGSEGV SIGBUS SIGILL SIGFPE
