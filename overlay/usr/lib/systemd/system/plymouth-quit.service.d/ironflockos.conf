# The splash stays on the screen after the boot (docs/build.md, "The
# screen"): Plymouth quits without clearing it, and the first virtual terminal
# stays in graphics mode, so no kernel message is drawn over it. With
# plymouth.force-frame-buffer-on-boot Plymouth has drawn into the kernel's
# framebuffer console device, which keeps the picture after Plymouth is gone;
# a screen app that opens the graphics device takes over from there. Without
# the splash (boot=text) Plymouth does not run, and this fails quietly.
#
# It quits after the enrollment, so that what enroll has to say to a person
# at the device (no .flock: not enrolled) is the message that stays below
# the picture (/usr/lib/ironflockos/screen-message).
[Unit]
After=ironflockos-enroll.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
