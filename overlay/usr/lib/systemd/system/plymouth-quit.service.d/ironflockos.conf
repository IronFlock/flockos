# The splash stays on the screen after the boot (docs/build.md, "The
# screen"): /usr/lib/ironflockos/keep-splash puts the kernel's framebuffer
# device, into which Plymouth has drawn the same picture, on the screen in
# Plymouth's place and then has Plymouth quit without clearing it; the first
# virtual terminal stays in graphics mode, so no kernel message is drawn over
# it. Nothing of the image holds the graphics device then: a screen app that
# opens it takes the screen, and when it closes it the splash is back.
# Without the splash (boot=text) Plymouth does not run, and this does
# nothing.
#
# It quits after the enrollment, so that what enroll has to say to a person
# at the device (no .flock: not enrolled) is the message that stays below
# the picture (/usr/lib/ironflockos/screen-message).
[Unit]
After=ironflockos-enroll.service

[Service]
ExecStart=
ExecStart=-/usr/lib/ironflockos/keep-splash
