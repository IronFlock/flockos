# With the splash the first virtual terminal belongs to the screen: the
# splash, then a screen app (docs/kiosk-plan.md, P1). Logins are on the
# terminals 2 to 6, where logind starts a getty when one is switched to.
# With boot=text the kernel command line has no "splash", and tty1 has its
# login prompt as before.
[Unit]
ConditionKernelCommandLine=!splash
